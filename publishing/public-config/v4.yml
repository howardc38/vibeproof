name: v4

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Tests
        run: python3 tests/run_without_silent_skips.py

      - name: Documentation affected by this source change
        env:
          DOC_BASE: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
        run: |
          if [ "$DOC_BASE" = "0000000000000000000000000000000000000000" ]; then
            DOC_BASE=$(git merge-base HEAD origin/main)
          fi
          python3 tools/doc_impact.py --base "$DOC_BASE" --head HEAD
      - name: Facts still resolve
        run: |
          python3 - <<'PY'
          import subprocess, sys
          from pathlib import Path
          from kernel.config import facts_path_for
          table = facts_path_for(Path.cwd())
          if table is None:
              sys.exit("no facts table for this distribution")
          sys.exit(subprocess.run([sys.executable, "-m", "kernel.facts", "verify",
              str(table), ".", "--gone-only"]).returncode)
          PY
      - name: Documentation matches code
        run: ./bin/v4 --repo . accept --here --docs
      - name: Checker and detector fixtures
        run: ./bin/v4 --repo . accept --here --fixtures
      - name: Public demo
        run: python3 examples/first-proof/run.py --quiet

  provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Published tree matches its manifest
        run: python3 tools/export_public.py verify --root .

# The private repository's live ledger and sweep schedule are operational data.
# They are not exported. Product-level chain/sweep behavior remains in the test suite.
