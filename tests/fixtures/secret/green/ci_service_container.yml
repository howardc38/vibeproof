# A throwaway Postgres container's default credentials. Rule:
# user-equals-password.
jobs:
  test:
    services:
      postgres:
        image: postgres:16
    env:
      ADOPTER_TEST_ADMIN_URL: "postgresql://postgres:postgres@localhost:5432/postgres"
      ADOPTER_DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/postgres"
